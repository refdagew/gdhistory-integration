name: Build Geode Mod

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build with Geode SDK from mod.json
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          build-config: Release

      - name: Upload Geode package
        uses: actions/upload-artifact@v4
        with:
          name: gdhistory-integration-windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
